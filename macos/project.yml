name: eqviz
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: NO

targets:
  eqviz:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: eqviz
    settings:
      base:
        PRODUCT_NAME: eqviz
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.eqviz
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: eqviz/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        INFOPLIST_KEY_CFBundleDisplayName: eqviz
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHighResolutionCapable: YES
    scheme:
      testTargets:
        - eqvizTests

  eqvizTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: eqvizTests
      - path: eqviz/DSP
      - path: eqviz/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.eqviz.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
